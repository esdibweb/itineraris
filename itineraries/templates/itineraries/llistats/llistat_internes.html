{% extends 'itineraries/llistat.html' %}

{% block title %}Llistat d'activitats internes{% endblock %}

{% block title_content %}Llistat d'activitats internes{% endblock %}

{% block content %}
    <table id="internes" class="table table-striped">
    </table>
    <a class="btn btn-secondary btn-sm" href="{% url 'itineraries:nova_internes' %}">Crear nou registre</a>

{% endblock %}

{% block extra_scripts %}
<script>

    $(document).ready(function() {

        idTable = 'internes';
        ajaxUrl = "{% url 'itineraries:internes_data' %}";

        const editUrlTemplate = "{% url 'itineraries:edit_internes' pk=0 %}";
        const deleteUrlTemplate = "{% url 'itineraries:delete_internes' pk=0 %}";

        const buttonWidth = "80px";

        $('#' + idTable).DataTable({
            "ajax": ajaxUrl,
            "language": {
                "lengthMenu": "Mostrar _MENU_ entrades per pàgina",
                "zeroRecords": "No s'han trobat resultats",
                "info": "Mostrant de _START_ a _END_ de _TOTAL_ entrades",
                "infoEmpty": "Mostrant de 0 a 0 de 0 entrades",
                "infoFiltered": "(filtrat de _MAX_ entrades en total)",
                "search": "Cercar:",
                "paginate": {
                    "first": "Primer",
                    "last": "Últim",
                    "next": "Següent",
                    "previous": "Anterior"
                }
            },
            "stateSave": true,
            "autoWidth": false, // Evita que les columnes es redimensionin automàticament
            "columns": [
                { "data": "title", "title": "Títol", "render": DataTable.render.text() },
                { "data": "date", "title": "Data" },
                {
                    "data": null,
                    "title": 'Opcions',
                    "orderable": false,
                    "className": "text-center",  // Centra el contingut de la columna
                    "render": function (data, type, row) {

                        const editUrl = editUrlTemplate.replace('0', row.id);
                        const deleteUrl = deleteUrlTemplate.replace('0', row.id);

                        return '<div class="d-flex justify-content-end gap-2">' +
                            '<a href="' + editUrl + '" class="btn btn-sm btn-secondary" style="width:' + buttonWidth + '">Editar</a>' +
                            '<form method="POST" action="' + deleteUrl + '" style="display:inline;" onsubmit="return confirm(\'Totes les hores associades seran esborrades. Estàs segur que vols eliminar aquest element?\');">' +
                                '<input type="hidden" name="csrfmiddlewaretoken" value="' + getCSRFToken() + '">' +  // CSRF token function
                                '<button type="submit" class="btn btn-sm btn-danger" style="width:' + buttonWidth + '">Esborrar</button>' +
                            '</form>' +
                            '</div>';
                    }
                }
            ],
            "columnDefs": [
                { "width": "1%", "targets": -1 }
            ]
        });

});

</script>

{% endblock %}
